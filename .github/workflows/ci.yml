name: CI & Release

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # Läuft nur nach einem gruenen build-Job und nur bei einem Push auf main (nicht bei PRs).
  # Ermittelt Version + Changelog direkt aus den Conventional-Commits seit dem letzten Tag
  # (kein Review-PR mehr, siehe scripts/release.mjs), committet/taggt, veroeffentlicht das
  # GitHub-Release und haengt den Windows-Installer direkt an -- ein einziger linearer Lauf.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute version and changelog
        id: release
        run: node scripts/release.mjs

      - name: Commit and tag release
        if: steps.release.outputs.released == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git commit -m "chore(main): release ${{ steps.release.outputs.version }}"
          git tag ${{ steps.release.outputs.tag }}
          git push origin main --follow-tags

      - name: Create GitHub Release
        if: steps.release.outputs.released == 'true'
        run: gh release create ${{ steps.release.outputs.tag }} --title ${{ steps.release.outputs.tag }} --notes-file .release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        if: steps.release.outputs.released == 'true'
        run: npm run build

      - name: Package and publish (Windows NSIS-Installer -> GitHub Release)
        if: steps.release.outputs.released == 'true'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
