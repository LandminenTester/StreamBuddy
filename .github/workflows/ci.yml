name: CI & Release

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: write

jobs:
  # Ein einziger Job fuer alles: PRs und Pushes auf Nicht-main-Branches durchlaufen nur die
  # Checks (Typecheck/Lint/Test/Build). Ein Push auf main haengt direkt im selben Lauf die
  # Release-Schritte an (kein zweiter Job, keine doppelte Installation/Build) -- Version +
  # Changelog werden aus den Conventional-Commits seit dem letzten Tag berechnet
  # (scripts/release.mjs), committet/getaggt, das GitHub-Release veroeffentlicht und der
  # bereits gebaute Windows-Installer direkt angehaengt.
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: i18n keys
        run: npm run i18n:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Compute version and changelog
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/release.mjs

      - name: Commit and tag release
        if: steps.release.outputs.released == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git commit -m "chore(main): release ${{ steps.release.outputs.version }}"
          git tag ${{ steps.release.outputs.tag }}
          git push origin main
          git push origin ${{ steps.release.outputs.tag }}

      - name: Create GitHub Release
        if: steps.release.outputs.released == 'true'
        run: gh release create ${{ steps.release.outputs.tag }} --title ${{ steps.release.outputs.tag }} --notes-file .release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and publish (Windows NSIS-Installer -> GitHub Release)
        if: steps.release.outputs.released == 'true'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
