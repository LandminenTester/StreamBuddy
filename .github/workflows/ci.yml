name: CI & Release

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # Läuft nur nach einem gruenen build-Job und nur bei einem Push auf main (nicht
  # bei PRs) -- erstellt/aktualisiert den Release-PR bzw. schneidet den Release,
  # sobald dieser PR gemergt wird.
  release-please:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node

  # Läuft nur, wenn release-please tatsaechlich einen Release erstellt hat (also
  # beim Mergen des von release-please erstellten Release-PRs) -- baut den
  # Windows-Installer und haengt ihn direkt an dieses bereits veroeffentlichte
  # Release an (siehe electron-builder.yml: releaseType: release).
  package-and-publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package and publish (Windows NSIS-Installer -> GitHub Release)
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
